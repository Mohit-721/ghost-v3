[project]
name = "ghost-ai"
version = "0.1.0"
description = "The AI daemon that haunts your machine."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"

dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "watchfiles>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tiktoken>=0.7",
    "tenacity>=8.0",
    "tomli>=2.0;python_version<'3.12'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
vectors = ["sqlite-vec>=0.1"]
anthropic = ["anthropic>=0.30"]
google = ["google-generativeai>=0.7"]
embeddings = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
]

[project.scripts]
ghost = "ghost.cli.app:main"
ghostd = "ghost.core.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
